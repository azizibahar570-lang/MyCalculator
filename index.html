<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشین حساب من</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #11151b;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 360px;
    max-width: 95%;
    padding: 20px;
    background: #171b22;
    border: 2px solid #343a44;
    border-radius: 30px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
}

h2 {
    text-align: center;
    color: white;
    margin: 0 0 18px;
    font-size: 27px;
}

#display {
    width: 100%;
    height: 82px;
    background: #263129;
    border: 3px solid #101410;
    border-radius: 18px;
    color: white;
    font-size: 36px;
    font-weight: bold;
    text-align: right;
    padding: 10px 15px;
    margin-bottom: 16px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.6);
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 65px;
    border-radius: 17px;
    border: 2px solid #111820;
    background: linear-gradient(#303640, #20252d);
    color: white;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 5px 0 #0c1015,
                0 7px 12px rgba(0,0,0,0.3);
    cursor: pointer;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #0c1015;
}

.operator {
    background: linear-gradient(#ffab32, #ed6e00);
}

.clear {
    background: linear-gradient(#ff646b, #bd1f2d);
}

.equal {
    grid-column: span 2;
    background: linear-gradient(#ffab32, #ed6e00);
}

.zero {
    grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">

<h2>ماشین حساب من</h2>

<input id="display" type="text" value="0" readonly>

<div class="buttons">

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('-')">−</button>

<button class="zero" onclick="add('0')">0</button>
<button class="clear" onclick="clearDisplay()">C</button>
<button class="operator" onclick="add('+')">+</button>

<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<script>

let justCalculated = false;

function add(value) {

    let display = document.getElementById("display");

    if (display.value === "0" || justCalculated) {
        display.value = "";
        justCalculated = false;
    }

    display.value += value;
}

function clearDisplay() {

    document.getElementById("display").value = "0";
    justCalculated = false;
}

function calculate() {

    let display = document.getElementById("display");

    try {

        let expression = display.value;

        if (!expression) return;

        let result = eval(expression);

        if (!Number.isFinite(result)) {
            throw new Error();
        }

        display.value = result;
        justCalculated = true;

    } catch {

        display.value = "خطا";
        justCalculated = true;
    }
}

</script>

</body>
</html>
